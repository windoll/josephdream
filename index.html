<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>約瑟的夢 — 十七歲的抉擇</title>
<meta name="description" content="如果你是十七歲的約瑟,被哥哥丟進井裡——你會原諒,還是報復?互動聖經文字冒險,每個選擇都有後果,8 種結局,一輪約 7 分鐘。">

<meta property="og:type" content="website">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#1a1410; --panel:#241b13;
    --gold:#d9b15e; --gold-soft:#b8924a;
    --ink:#ede4d3; --ink-dim:#b8ac95; --sand:#3a2c1d;
    --accent:#c97b4a; --good:#7fae6b; --bad:#c45a52;
    --faith:#e8c46a; --wisdom:#8fc1e0; --ambition:#b58be0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Serif TC","Songti TC","Microsoft JhengHei",serif;
    background:radial-gradient(1200px 600px at 50% -10%, #2a1f15 0%, var(--bg) 60%),var(--bg);
    color:var(--ink); min-height:100vh; min-height:100dvh;
    padding:24px; line-height:1.8;
  }
  #app{
    width:100%; max-width:780px; margin:0 auto;
    background:linear-gradient(180deg,#2b2016,#221912);
    border:1px solid #3d2e1f; border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(217,177,94,.12);
  }
  header{
    padding:18px 28px 14px; border-bottom:1px solid #3a2c1d;
    background:linear-gradient(180deg,#2e2316,#281e13);
    position:sticky; top:0; z-index:20;
    border-radius:16px 16px 0 0;
  }
  header h1{font-size:22px; letter-spacing:.16em; color:var(--gold); font-weight:700;}
  header .sub{font-size:12px; color:var(--ink-dim); letter-spacing:.18em; margin-top:3px;}
  .stats{display:flex; gap:14px; margin-top:11px; flex-wrap:wrap;}
  .stat{font-size:12px; color:var(--ink-dim); letter-spacing:.08em; display:flex; align-items:center; gap:6px; position:relative;}
  .bar{width:64px; height:7px; border-radius:6px; background:#1c150e; overflow:hidden; border:1px solid #3a2c1d;}
  .bar > i{display:block; height:100%; border-radius:6px; transition:width .5s ease}
  .bar.faith > i{background:linear-gradient(90deg,#caa44e,#f0d488)}
  .bar.wisdom > i{background:linear-gradient(90deg,#5d8ab0,#8fc1e0)}
  .bar.ambition > i{background:linear-gradient(90deg,#7d5bb0,#b58be0)}
  .bar.flash{animation:barflash .5s ease}
  .num{font-size:12.5px; font-weight:700; min-width:22px; text-align:right}
  @keyframes barflash{0%,100%{box-shadow:none}40%{box-shadow:0 0 10px 2px currentColor}}
  .floatup{position:absolute; right:-8px; top:-15px; font-size:13px; font-weight:700; pointer-events:none; animation:floatup .9s ease forwards;}
  @keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

  main{padding:22px 30px 8px}
  .art{width:100%; height:185px; border-radius:12px; overflow:hidden; border:1px solid #3a2c1d; margin-bottom:16px; background:#15100b; box-shadow:inset 0 0 40px rgba(0,0,0,.5);}
  .art svg{display:block; width:100%; height:100%}
  .scene-title{color:var(--gold-soft); font-size:13px; letter-spacing:.26em; margin-bottom:4px;}
  .ref{font-size:11.5px; color:#7d7660; letter-spacing:.04em; margin-bottom:13px}
  .ref.fiction{color:#c9a06a; font-weight:600}
  .text{font-size:17px; color:var(--ink); white-space:pre-wrap; min-height:70px;}
  .text p{margin-bottom:13px}

  .choices{padding:6px 30px 28px; display:flex; flex-direction:column; gap:11px}
  button.choice{
    text-align:left; font-family:inherit; font-size:15.5px; color:var(--ink);
    background:linear-gradient(180deg,#312415,#281d12); border:1px solid #4a3826;
    padding:13px 16px; border-radius:11px; cursor:pointer; transition:all .18s ease;
    position:relative; line-height:1.55;
  }
  @media(hover:hover){
    button.choice:not(.locked):hover{border-color:var(--gold); color:#fff; transform:translateX(4px); box-shadow:-4px 0 0 0 var(--gold);}
  }
  button.choice.locked{opacity:.5; cursor:not-allowed; border-style:dashed;}
  button.choice.single{text-align:center; max-width:340px; margin:0 auto; width:100%; color:var(--gold-soft); letter-spacing:.1em}
  .tag{display:inline-block; font-size:11px; letter-spacing:.08em; color:var(--bg); background:var(--gold-soft); padding:1px 8px; border-radius:20px; margin-right:8px; vertical-align:middle;}
  .tag.bible{background:#3a5a8c; color:#eaf2ff}
  .tag.end{background:#7a3b35; color:#ffddd6}
  .tag.bibleend{background:linear-gradient(90deg,#b8924a,#e8c46a); color:#1a1410; font-weight:700}
  .echoline{color:#c9b896; font-style:italic; font-size:15px; margin-bottom:14px; padding-left:12px; border-left:2px solid #4a3826;}
  .cnum{color:#8a7a5c; font-size:12.5px; margin-right:8px; font-weight:700}
  .lockhint{font-size:11.5px; color:#9a8868; margin-left:4px}
  .effs{display:flex; gap:7px; margin-top:8px; flex-wrap:wrap}
  .eff{font-size:11.5px; letter-spacing:.05em; padding:2px 9px; border-radius:20px; border:1px solid; background:rgba(0,0,0,.25); font-weight:600;}

  .titlecard .hook{font-size:17px; margin-bottom:18px}
  .legend{display:flex; flex-direction:column; gap:9px; font-size:13.5px; color:var(--ink-dim);
    background:#1e160e; border:1px solid #3a2c1d; border-radius:10px; padding:14px 16px;}
  .legend .lead{color:var(--gold-soft); letter-spacing:.08em}

  .ending{text-align:center; padding:6px 0 4px}
  .ending .badge{font-size:13px; letter-spacing:.3em; color:var(--gold)}
  .ending h2{font-size:26px; margin:8px 0 6px; color:#fff; letter-spacing:.06em}
  .ending .etype{font-size:15px; color:var(--gold); letter-spacing:.12em; margin-bottom:8px}
  .ending .kind{font-size:13px; color:var(--ink-dim); letter-spacing:.2em}
  .ending .kind.good{color:var(--good)} .ending .kind.bad{color:var(--bad)}
  .ending .canon{margin-top:12px; font-size:12.5px; color:#9cc0ee; letter-spacing:.1em; border:1px solid #3a5a8c; border-radius:20px; padding:5px 13px; display:inline-block;}
  .nearmiss{margin-top:16px; font-size:14px; color:var(--gold-soft); font-style:italic; text-align:center}
  .bibleline{margin-top:10px; font-size:13px; color:#9cc0ee; text-align:center; letter-spacing:.04em}
  .reflect{margin-top:18px; background:#1e160e; border:1px solid #4a3826; border-radius:10px; padding:13px 16px; font-size:14.5px; color:var(--ink-dim); text-align:center;}
  .reflect b{color:var(--gold-soft); letter-spacing:.1em; display:block; margin-bottom:6px; font-size:12px}
  .identity{margin-top:12px; background:#18200f; border:1px solid #4a5a36; border-radius:10px; padding:13px 16px; font-size:14px; color:#c5d4b2; text-align:center;}
  .identity b{color:#9ec27f; letter-spacing:.1em; display:block; margin-bottom:6px; font-size:12px}
  .leadnote{font-size:12px; color:#8d8268; margin:2px 0 10px}
  .helpline{margin-top:14px; font-size:12.5px; color:#9a8c70; text-align:center; letter-spacing:.03em}
  .disc{margin-top:14px; background:#1e160e; border:1px solid #3a2c1d; border-radius:10px; padding:4px 16px;}
  .disc summary{cursor:pointer; color:var(--gold-soft); font-size:13.5px; letter-spacing:.08em; padding:9px 0;}
  .disc ol{padding:4px 0 12px 22px; font-size:14px; color:var(--ink-dim)}
  .disc li{margin-bottom:9px}
  .disc .printlink{font-size:12.5px; color:var(--gold-soft); cursor:pointer; text-decoration:underline; display:inline-block; margin-bottom:12px}
  .journey{margin-top:18px; border-top:1px solid #3a2c1d; padding-top:14px}
  .journey > b{color:var(--gold-soft); letter-spacing:.18em; font-size:12px}
  .jrow{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0; border-bottom:1px dashed #33271a; color:var(--ink-dim)}
  .jrow .jt{color:var(--gold-soft); min-width:74px; font-size:12px}
  .jrow .jc{flex:1; color:var(--ink)}
  .jrow .je{font-size:11px; font-weight:700}

  footer{display:flex; justify-content:space-between; align-items:center; padding:10px 20px 12px; border-top:1px solid #3a2c1d; font-size:13px; color:var(--ink-dim); border-radius:0 0 16px 16px;}
  .links{display:flex; gap:8px}
  .links a{color:var(--gold-soft); cursor:pointer; text-decoration:none; letter-spacing:.08em; padding:8px 10px; border-radius:8px;}
  @media(hover:hover){ .links a:hover{color:var(--gold); background:#2c2114} }
  .verse{margin-top:14px; font-size:13.5px; color:var(--gold-soft); font-style:italic; border-left:2px solid var(--gold-soft); padding-left:12px;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal-bg.show{display:flex}
  .modal{background:#241b13; border:1px solid #4a3826; border-radius:14px; max-width:520px; width:100%; padding:26px; max-height:80vh; overflow:auto;}
  .modal h3{color:var(--gold); letter-spacing:.2em; margin-bottom:16px; font-size:18px}
  .endlist{display:flex; flex-direction:column; gap:10px}
  .endrow{display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border:1px solid #3a2c1d; border-radius:9px; background:#1e160e;}
  .endrow.locked{color:#6d6250; font-style:italic}
  .endrow .nm{font-size:14.5px} .endrow .ds{font-size:12px; color:var(--ink-dim); margin-top:3px}
  .complete{border:1px solid var(--gold-soft); border-radius:10px; background:#2a2012; padding:13px 15px; margin-bottom:14px; font-size:13.5px; color:var(--gold); text-align:center}
  .modal .close{margin-top:18px; width:100%; padding:11px; border-radius:9px; cursor:pointer; background:var(--gold-soft); border:none; color:var(--bg); font-family:inherit; font-size:14px; letter-spacing:.2em;}
  .modal .ghost{margin-top:10px; width:100%; padding:11px; border-radius:9px; cursor:pointer; background:transparent; border:1px solid #4a3826; color:var(--ink-dim); font-family:inherit; font-size:14px; letter-spacing:.2em;}
  .count{font-size:12px; color:var(--ink-dim); margin-bottom:14px; letter-spacing:.1em}

  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

  @media(max-width:560px){
    body{padding:10px}
    main{padding:16px 16px 6px}.choices{padding:6px 16px 20px}
    header{padding:12px 16px 10px}
    header h1{font-size:18px}
    header .sub{display:none}
    .stats{margin-top:8px; gap:10px}
    .text{font-size:16px}.art{height:145px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
  @media print{
    body{background:#fff; color:#000; padding:0}
    #app{box-shadow:none; border:none; background:#fff; max-width:100%}
    header{position:static; background:#fff; border-color:#ccc}
    header h1,.scene-title{color:#5a4220}
    .stats,.art,.choices,footer,.modal-bg,.nearmiss{display:none !important}
    .text,.jrow .jc{color:#000}
    .ending h2{color:#000}.ending .etype{color:#5a4220}
    .reflect,.disc,.legend{background:#fff; border-color:#bbb; color:#222}
    .disc summary,.jrow .jt,.journey>b{color:#5a4220}
    .disc ol,.jrow,.refsline,.ref,.bibleline{color:#333}
    .verse{color:#5a4220; border-color:#5a4220}
    .disc .printlink{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>約 瑟 的 夢</h1>
    <div class="sub">創世記 · 一個十七歲少年的抉擇</div>
    <div class="stats" id="stats">
      <div class="stat statRow" data-k="faith" style="color:var(--faith)">信心·交託 <span class="bar faith"><i></i></span><b class="num" id="n_faith">20</b></div>
      <div class="stat statRow" data-k="wisdom" style="color:var(--wisdom)">智慧·解題 <span class="bar wisdom"><i></i></span><b class="num" id="n_wisdom">20</b></div>
      <div class="stat statRow" data-k="ambition" style="color:var(--ambition)">認同·被看見 <span class="bar ambition"><i></i></span><b class="num" id="n_ambition">20</b></div>
    </div>
  </header>
  <main>
    <div class="art" id="art"></div>
    <div class="scene-title" id="sceneTitle"></div>
    <div class="ref" id="ref"></div>
    <div class="text" id="text"></div>
  </main>
  <div class="choices" id="choices"></div>
  <footer>
    <div class="links">
      <a id="homeBtn">⌂ 封面</a>
      <a id="restart">↻ 重新開始</a>
      <a id="gallery">📜 結局圖鑑</a>
    </div>
    <div id="progress"></div>
  </footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>結 局 圖 鑑</h3>
    <div class="count" id="galCount"></div>
    <div class="endlist" id="endlist"></div>
    <button class="close" id="closeModal">關閉</button>
  </div>
</div>

<div class="modal-bg" id="confirmBg">
  <div class="modal">
    <h3>重 新 開 始</h3>
    <p style="font-size:14.5px;color:var(--ink-dim)">確定要從頭開始嗎?目前的進度會消失。<br>(已解鎖的結局圖鑑會保留)</p>
    <button class="close" id="confirmYes">重新開始</button>
    <button class="ghost" id="confirmNo">取消</button>
  </div>
</div>

<script>
/* ============================================================
   約瑟的夢 — 十七歲的抉擇 (青少年版)
   數值: faith 信心 / wisdom 智慧 / ambition 認同(內部鍵保留 ambition) (0–100，整十)
   機制: 取捨(負值) / 門檻(req,隱藏或顯示鎖) / callback(flags) — 全程無隨機
   ============================================================ */
const GAME_URL = "https://windoll.github.io/josephdream/";

/* ---------- 場景插畫 ---------- */
function artSVG(key){
  const sky=(a,b)=>`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="190" fill="url(#sky)"/>`;
  const sheaf=(x)=>`<g transform="translate(${x},150)"><polygon points="-5,-2 5,-2 26,-56 -26,-56" fill="#cda552"/><g stroke="#9c7a30" stroke-width="2"><line x1="0" y1="-6" x2="-22" y2="-54"/><line x1="0" y1="-6" x2="-9" y2="-58"/><line x1="0" y1="-6" x2="8" y2="-58"/><line x1="0" y1="-6" x2="22" y2="-54"/></g>${[-22,-9,8,22].map(gx=>`<ellipse cx="${gx}" cy="-55" rx="5" ry="9" fill="#e9c873"/>`).join("")}<rect x="-8" y="-16" width="16" height="9" rx="3" fill="#8a6a2e"/></g>`;
  const A={
    coat: sky("#5a3f6b","#7a4a3a")+`<circle cx="70" cy="50" r="20" fill="#f3e2a8"/><g transform="translate(200,30)"><rect x="-46" y="20" width="92" height="120" rx="8" fill="#c9863f"/><rect x="-46" y="20" width="92" height="20" fill="#b85b3a"/><rect x="-46" y="50" width="92" height="16" fill="#d9b15e"/><rect x="-46" y="78" width="92" height="16" fill="#5d8ab0"/><rect x="-46" y="106" width="92" height="16" fill="#7fae6b"/><rect x="-64" y="26" width="22" height="56" rx="6" fill="#c9863f"/><rect x="42" y="26" width="22" height="56" rx="6" fill="#c9863f"/></g>`,
    desert: sky("#e0a85a","#c97b4a")+`<circle cx="200" cy="56" r="28" fill="#fff2cf" opacity=".95"/><rect y="138" width="400" height="52" fill="#caa05c"/><path d="M0 152 Q100 124 200 152 T400 152 L400 190 L0 190 Z" fill="#b88846"/><g fill="#5a3f28" transform="translate(232,92)"><rect x="8" y="30" width="6" height="28"/><rect x="22" y="30" width="6" height="28"/><rect x="46" y="30" width="6" height="28"/><rect x="60" y="30" width="6" height="28"/><ellipse cx="37" cy="28" rx="34" ry="13"/><path d="M10 28 Q21 4 33 28 Q45 4 64 28 Z"/><path d="M62 30 Q77 24 75 5 Q83 1 87 8 Q85 16 80 16 Q80 24 74 32 Z"/><path d="M5 22 Q-4 28 1 40" stroke="#5a3f28" stroke-width="3" fill="none"/></g>`,
    pit: sky("#23344f","#3a2c1d")+`<circle cx="60" cy="44" r="18" fill="#f3e2a8" opacity=".85"/><rect y="120" width="400" height="70" fill="#43321f"/><ellipse cx="200" cy="128" rx="78" ry="20" fill="#2a1f13"/><path d="M130 130 L150 190 L250 190 L270 130 Z" fill="#1a120a"/><ellipse cx="200" cy="128" rx="64" ry="14" fill="#0d0905"/>`,
    pyramid: sky("#f0c674","#d98c4a")+`<circle cx="320" cy="52" r="26" fill="#fff4d4"/><rect y="140" width="400" height="50" fill="#cfa157"/><polygon points="90,140 175,46 260,140" fill="#caa05c"/><polygon points="175,46 260,140 220,140 175,70" fill="#a87f3e"/><polygon points="220,140 285,78 350,140" fill="#bd9450"/>`,
    house: sky("#caa45e","#8a6a40")+`<rect y="120" width="400" height="70" fill="#6e5535"/><rect x="80" y="60" width="240" height="80" fill="#b89154"/><rect x="80" y="48" width="240" height="16" fill="#8a6a3e"/><rect x="120" y="90" width="34" height="50" fill="#3a2a18"/><rect x="246" y="90" width="34" height="50" fill="#3a2a18"/><rect x="190" y="84" width="20" height="56" fill="#caa05c"/><circle cx="60" cy="44" r="16" fill="#f3e2a8" opacity=".85"/>`,
    prison: sky("#2a2636","#1a1622")+`<rect width="400" height="190" fill="#241d28"/><rect y="150" width="400" height="40" fill="#15101a"/>${[70,130,190,250,310].map(x=>`<rect x="${x}" y="30" width="10" height="120" fill="#4a4150"/>`).join("")}<rect x="40" y="26" width="320" height="10" fill="#4a4150"/><rect x="40" y="146" width="320" height="10" fill="#4a4150"/><rect x="30" y="50" width="8" height="60" fill="#d9b15e" opacity=".3"/>`,
    pharaoh: sky("#e8c46a","#b8863c")+`<rect y="140" width="400" height="50" fill="#a87f3e"/><polygon points="170,140 170,80 200,60 230,80 230,140" fill="#d9b15e"/><rect x="178" y="92" width="44" height="48" fill="#c99a3e"/><circle cx="200" cy="74" r="13" fill="#caa05c"/><rect x="150" y="138" width="100" height="6" fill="#8a6a3e"/>${[120,160,240,280].map(x=>`<rect x="${x}" y="70" width="9" height="70" fill="#bd9450"/>`).join("")}<circle cx="60" cy="44" r="18" fill="#fff4d4"/>`,
    grain: sky("#f0c674","#d9a24a")+`<circle cx="334" cy="46" r="22" fill="#fff4d4"/><rect y="150" width="400" height="40" fill="#c89a4e"/><ellipse cx="92" cy="150" rx="40" ry="20" fill="#9c7a44"/><path d="M58 150 Q60 124 92 122 Q124 124 126 150 Z" fill="#a9854c"/><path d="M62 150 Q64 130 92 128 Q120 130 122 150 Z" fill="#b8924f"/>${sheaf(190)+sheaf(238)+sheaf(286)}`,
    reunion: sky("#c98a5a","#7a4a3a")+`<circle cx="200" cy="54" r="26" fill="#fff0cf" opacity=".9"/><rect y="140" width="400" height="50" fill="#5a4128"/><g fill="#3a2a18"><circle cx="160" cy="104" r="16"/><rect x="146" y="118" width="28" height="34" rx="6"/><circle cx="240" cy="104" r="16"/><rect x="226" y="118" width="28" height="34" rx="6"/></g><path d="M176 120 Q200 108 224 120" stroke="#d9b15e" stroke-width="4" fill="none"/>`,
    good: sky("#caa44e","#7fae6b")+`<circle cx="200" cy="80" r="48" fill="#f3e8b8" opacity=".5"/><circle cx="200" cy="80" r="30" fill="#fff4d4"/><rect y="150" width="400" height="40" fill="#5d7a4a"/>`,
    bad: sky("#3a2630","#15100f")+`<circle cx="200" cy="70" r="30" fill="#6b5040" opacity=".6"/><rect y="150" width="400" height="40" fill="#1a1210"/><path d="M120 150 L160 110 L200 150 L250 100 L300 150 Z" fill="#241712"/>`,

/* ---------- callback：讓遊戲記得你的選擇 ---------- */
const CALLBACKS = {
  prison: ()=> flags.outwit ? {pre:"你的事,傳得比你的人還快:那個站得筆直走進牢門的希伯來人。獄裡的人,都想看看你長什麼樣子。"} : null,
  brothers: ()=> flags.grudge ? {post:"那天曠野的風裡,你說過:總有一天,他們會親眼看見你是誰。——如今,那一天到了,他們就跪在你的腳前。"} : null,
  resolve: ()=>{
    const parts=[];
    if(flags.forgave_direct) parts.push("你不需要設局,也不需要證據。在他們開口求饒以前,你就已經放下了。你只吩咐一件事:先把父親和小弟便雅憫接來——你想看著全家人的臉,說出那個名字。");
    if(flags.fled) parts.push("這一次,你沒有逃。");
    return parts.length ? {pre:parts.join("\n\n")} : null;
  },
};

/* ============================================================
   引擎
   ============================================================ */
const START={faith:20, wisdom:20, ambition:20};
const stats = {...START};
let flags = {};
let history = [];
let journey = [];
let pendingEcho = ""; // 微回應:上一個選擇在下一幕開頭被「看見」的一句話
const $ = id=>document.getElementById(id);
const STAT_LABEL={faith:"信心", wisdom:"智慧", ambition:"認同"}; // 內部鍵 ambition 保留(存檔相容),顯示一律「認同」
function clamp(v){return Math.max(0,Math.min(100,v));}
function applyEff(eff){ if(!eff)return;
  stats.faith=clamp(stats.faith+(eff.faith||0));
  stats.wisdom=clamp(stats.wisdom+(eff.wisdom||0));
  stats.ambition=clamp(stats.ambition+(eff.ambition||0));
}
function renderStats(){
  for(const k of ["faith","wisdom","ambition"]){
    document.querySelector(`.bar.${k}>i`).style.width=stats[k]+"%";
    $("n_"+k).textContent=stats[k];
    const row=document.querySelector(`.statRow[data-k="${k}"]`);
    if(row) row.setAttribute("aria-label", `${STAT_LABEL[k]} ${stats[k]}`);
  }
}
function floatStat(eff){
  const colors={faith:"#e8c46a",wisdom:"#8fc1e0",ambition:"#b58be0"};
  ["faith","wisdom","ambition"].forEach(k=>{
    const v=eff&&eff[k]; if(!v) return;
    const row=document.querySelector('.statRow[data-k="'+k+'"]'); if(!row) return;
    const s=document.createElement("span");
    s.className="floatup"; s.style.color=colors[k];
    s.textContent=(v>0?"+":"−")+Math.abs(v);
    row.appendChild(s); setTimeout(()=>s.remove(),900);
    const bar=row.querySelector(".bar"); if(bar){ bar.classList.add("flash"); setTimeout(()=>bar.classList.remove("flash"),500); }
  });
}
function effChips(eff){
  if(!eff) return "";
  const map=[["faith","信心","#e8c46a"],["wisdom","智慧","#8fc1e0"],["ambition","認同","#b58be0"]];
  let out="";
  for(const [k,label,color] of map){
    const v=eff[k]||0; if(v===0) continue;
    out+=`<span class="eff" style="color:${color};border-color:${color}66">${v>0?"+":"−"}${Math.abs(v)} ${label}</span>`;
  }
  return out?`<div class="effs">${out}</div>`:"";
}
function paraHTML(txt){ return (txt||"").split("\n\n").map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join(""); }
function sceneShort(sc){ return (sc.title||"").replace(/^第.+· /,"").replace(/^(結局|終幕) · /,""); }
function isFiction(sc){ return !!(sc.fiction || /虛構|What-if/.test(sc.ref||"")); }

function save(curId){ try{ localStorage.setItem("joseph_save", JSON.stringify({curId, stats, history, journey, flags})); }catch(_){} }
function loadSave(){ try{return JSON.parse(localStorage.getItem("joseph_save"));}catch(_){return null;} }
function unlock(endId){ if(!unlocked.includes(endId)){ unlocked.push(endId); try{ localStorage.setItem("joseph_endings", JSON.stringify(unlocked)); }catch(_){} } }

/* 寬恕路線：判定順序固定（見 CLAUDE.md）。
   全部門檻未達 → halfway（半路上的和好）：和好不被取消,但「最圓滿」要靠信智雙高換 */
function pickDynamicEnding(){
  const {faith,wisdom,ambition}=stats;
  if(ambition>=60 && ambition>faith && ambition>wisdom) return "egypt_lord";
  if(faith>=50 && wisdom>=50) return "reconcile";
  if(faith>=60 && faith>wisdom && faith>ambition) return "faith_crown";
  if(wisdom>=60 && wisdom>faith && wisdom>ambition) return "wise_savior";
  return "halfway";
}

/* 結局頁：差一點就解鎖的提示（只取最接近的一條） */
function nearMissHTML(endingId){
  const {faith,wisdom,ambition}=stats;
  const cands=[];
  if(endingId!=="egypt_lord" && !unlocked.includes("egypt_lord") && ambition>=40 && ambition<60)
    cands.push({gap:60-ambition, text:`你的認同停在 ${ambition}——再往掌聲走近一點,你會看見另一個約瑟。`});
  if(endingId!=="faith_crown" && !unlocked.includes("faith_crown") && faith>=40 && faith<60)
    cands.push({gap:60-faith, text:`你的信心停在 ${faith}——再多一點,夢會以另一種方式應驗。`});
  if(endingId!=="wise_savior" && !unlocked.includes("wise_savior") && wisdom>=40 && wisdom<60)
    cands.push({gap:60-wisdom, text:`你的智慧停在 ${wisdom}——再磨利一點,會有千萬人因你活下來。`});
  if(endingId!=="reconcile" && !unlocked.includes("reconcile") && (faith>=40||wisdom>=40))
    cands.push({gap:Math.max(50-faith,0)+Math.max(50-wisdom,0), text:`聽說,讓信心與智慧並肩走到最後的人,會抵達一個更飽足的地方……`});
  if(!cands.length) return "";
  cands.sort((a,b)=>a.gap-b.gap);
  return `<div class="nearmiss">${cands[0].text}</div>`;
}

function bibleLineHTML(){
  const hadB=journey.filter(j=>j.hadB).length;
  if(!hadB) return "";
  const took=journey.filter(j=>j.bible).length;
  return `<div class="bibleline">📖 這一輪,你在 ${hadB} 個關鍵抉擇中,有 ${took} 次與聖經中的約瑟做了相同的選擇</div>`;
}

function journeyHTML(){
  if(!journey.length) return "";
  const ic={faith:["信","#e8c46a"],wisdom:["智","#8fc1e0"],ambition:["認","#b58be0"]};
  const rows=journey.map(j=>{
    let chip="";
    for(const k of ["faith","wisdom","ambition"]){
      const v=j.eff&&j.eff[k]; if(!v) continue;
      chip+=`<span class="je" style="color:${ic[k][1]}">${v>0?"+":"−"}${Math.abs(v)}${ic[k][0]}</span> `;
    }
    const fic=j.fic?'<span style="color:#c9a06a">✦</span> ':'';
    return `<div class="jrow"><div class="jt">${fic}${j.title}</div><div class="jc">${j.choice}${j.bible?' <span style="color:#9cc0ee">📖</span>':''}</div><div>${chip}</div></div>`;
  }).join("");
  return `<div class="journey"><b>— 你 的 旅 程 —</b>${rows}</div>`;
}

/* 固定討論題:三段安全橋（約瑟家 → 觀察到的模式 → 自己,可保留 → 身份在神） */
const DISC = [
  "約瑟的家,一代一代重複著同樣的事:爺爺那一代偏心,父親雅各用詭計搶了祝福、又在舅舅家被困了二十年,到了約瑟這一代——還是偏心,還是嫉妒。(創世記 25、27、29–31、37) 你在故事裡,還看到哪些「一代傳一代」的模式?",
  "哥哥們跪在腳前的那一刻,約瑟其實可以做任何事。他後來做了什麼,跟他的家族「不一樣」的事?",
  "每個家都有自己的「慣性」——表達愛的方式、吵架的方式、面對錯誤的方式。用戲劇、電影,或你觀察過的別人家來舉例:你看過哪些模式?(想講自己家也可以,但完全不必)",
  "這一題,在心裡想就好,不用說出來:如果有的話,我的家給過我什麼好東西?有沒有哪一個模式,我希望「將來在我這一代停下來」?——兩問都可以只想一個,或都不想。",
  "約瑟給長子取名「瑪拿西」——意思是「神使我忘了一切的困苦和我父的全家」(創世記 41:51)。「忘了」不是假裝沒發生,而是那些事不再替他做決定。聖經說,凡接待耶穌的,就有權柄「作神的兒女」(約翰福音 1:12)——身份可以不再由「誰家的孩子」或「被怎麼對待過」決定。如果這是真的,會改變你看自己的方式嗎?",
];
function discHTML(){
  return `<details class="disc"><summary>📋 小組討論題（帶大家聊聊）</summary>
    <span class="printlink" id="printSheet">🖨 列印這份討論單</span>
    <div class="leadnote">給帶領者:①每一題都可以 pass,不需要理由。②第 4 題不點名、不追問、不邀請分享,也不書寫回收。③若有人說出正在發生的傷害:不在小組追問,會後私下陪伴,並連結輔導或專業資源。請向學生說清楚:約瑟是在哥哥們真的改變之後才相認——原諒,不等於回到會繼續傷害你的關係裡。</div>
    <ol>${DISC.map(q=>`<li>${q}</li>`).join("")}</ol></details>`;
}

function fallbackCopy(txt, btn){
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand && document.execCommand("copy");
    document.body.removeChild(ta);
    btn.textContent = ok ? "✅ 已複製,貼給朋友吧!" : "⚠ 複製失敗,請截圖分享";
  }catch(_){ btn.textContent="⚠ 複製失敗,請截圖分享"; }
}

function shareText(E){
  const star=E.kind==="good"?"★":E.kind==="bad"?"☠":"◇";
  const took=journey.filter(j=>j.bible).length;
  const hadB=journey.filter(j=>j.hadB).length;
  const trail=journey.map(j=>j.icon).join("");
  return `《約瑟的夢》我走出了結局【${E.name}・${E.type}】${star}\n信心${stats.faith} 智慧${stats.wisdom} 認同${stats.ambition}｜📖 ${took}/${hadB}｜圖鑑 ${unlocked.length}/${Object.keys(ENDINGS).length}\n${trail}\n換你選:${GAME_URL}`;
}

function go(id){
  const sc = S[id];
  if(!sc){console.error("missing scene",id);return;}
  history.push(id);

  let endingId = sc.ending;
  if(sc.dynamic) endingId = pickDynamicEnding();

  $("sceneTitle").textContent = sc.title||"";
  const refEl=$("ref");
  if(isFiction(sc)){ refEl.textContent = "✦ "+(sc.ref||"虛構支線"); refEl.className="ref fiction"; }
  else { refEl.textContent = sc.ref||""; refEl.className="ref"; }

  const art=$("art");
  art.classList.remove("fade"); void art.offsetWidth; art.classList.add("fade");
  art.innerHTML = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${artSVG(sc.art)}</svg>`;

  const main = $("text");
  main.classList.remove("fade"); void main.offsetWidth; main.classList.add("fade");
  const choicesEl = $("choices");
  choicesEl.innerHTML="";

  // callback 文字(text 可為函式:依 flags 回傳路線版本)
  let bodyText = (typeof sc.text==="function") ? sc.text() : sc.text;
  const cb = CALLBACKS[id] && CALLBACKS[id]();
  if(cb){ bodyText = (cb.pre? cb.pre+"\n\n":"") + bodyText + (cb.post? "\n\n"+cb.post:""); }

  if(endingId){
    pendingEcho="";
    unlock(endingId);
    const E = ENDINGS[endingId];
    main.innerHTML = `<div class="ending">
        <div class="badge">— 結 局 —</div>
        <h2>${E.name}</h2>
        <div class="etype">你是【${E.type}】的約瑟</div>
        <div class="kind ${E.kind}">${E.kind==="good"?"★ 美好結局":E.kind==="bad"?"☠ 悲劇結局":"◇ 中性結局"}</div>
        ${E.canonical?'<div class="canon">📖 這是聖經創世記中約瑟真實的結局</div>':''}
      </div>`
      + paraHTML(E.overrideText || bodyText)
      + (E.epilogue?paraHTML(E.epilogue):"")
      + (sc.verse && !E.overrideText?`<div class="verse">${sc.verse}</div>`:"")
      + nearMissHTML(endingId)
      + bibleLineHTML()
      + (E.reflect?`<div class="reflect"><b>想一想</b>${E.reflect}</div>`:"")
      + (E.identity?`<div class="identity"><b>🌱 身份的根</b>${E.identity}</div>`:"")
      + `<div class="helpline">如果故事裡的某些部分,碰到了你真實的傷——那不是你一個人要扛的。找一個你信任的大人聊聊。</div>`
      + discHTML()
      + journeyHTML();
    const total=Object.keys(ENDINGS).length;
    const shareBtn=mkChoice("📣 分享我的結局",()=>{
      const txt=shareText(E);
      if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); return; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt)
          .then(()=>{ shareBtn.textContent="✅ 已複製,貼給朋友吧!"; })
          .catch(()=>fallbackCopy(txt, shareBtn));
        return;
      }
      fallbackCopy(txt, shareBtn);
    });
    choicesEl.append(
      shareBtn,
      mkChoice("↻ 再玩一次,走不同的路",()=>reset()),
      mkChoice(`📜 結局圖鑑 (${unlocked.length}/${total})`,()=>openGallery())
    );
    const pl=$("printSheet");
    if(pl) pl.onclick=()=>{ document.querySelectorAll("details").forEach(d=>d.open=true); window.print(); };
    $("progress").textContent="已抵達結局";
    try{ localStorage.removeItem("joseph_save"); }catch(_){}
    renderStats(); window.scrollTo(0,0); return;
  }

  let echoHTML="";
  if(pendingEcho){ echoHTML=`<p class="echoline">${pendingEcho}</p>`; pendingEcho=""; }
  main.innerHTML = echoHTML + paraHTML(bodyText)+(sc.verse?`<div class="verse">${sc.verse}</div>`:"");
  renderChoices(sc);
  $("progress").textContent = `第 ${history.length} 段`;
  renderStats(); save(id); window.scrollTo(0,0);
}

function doChoice(sc, c){
  if(c.flag) flags[c.flag]=true;
  pendingEcho = c.echo || "";
  applyEff(c.eff); floatStat(c.eff); renderStats();
  let icon="▪️";
  if(c.bible) icon="📖";
  else if(c.eff){
    if((c.eff.ambition||0)>0) icon="🌟";
    else if((c.eff.faith||0)>0) icon="✨";
    else if((c.eff.wisdom||0)>0) icon="💡";
  }
  // 單鈕過場(小故事的「繼續」)不灌進旅程回顧
  const noteworthy = (sc.choices||[]).length>1 || c.bible || (c.eff&&((c.eff.faith||0)||(c.eff.wisdom||0)||(c.eff.ambition||0)));
  if(noteworthy) journey.push({title:sceneShort(sc), choice:c.text, eff:c.eff, bible:!!c.bible,
    hadB:(sc.choices||[]).some(x=>x.bible), icon, fic:isFiction(sc)});
  go(c.next);
}

function renderChoices(sc){
  const choicesEl=$("choices");
  choicesEl.innerHTML="";
  const rows=(sc.choices||[]).map(c=>({c, locked: !!(c.req && stats[c.req.stat] < c.req.val)}));
  const multi = rows.length>1;
  rows.forEach(({c, locked}, i)=>{
    const num = i+1;
    if(locked){ // 門檻一律顯示為鎖定按鈕(不可點),帶敘事短語
      const lb=document.createElement("button");
      lb.className="choice locked"; lb.disabled=true;
      lb.innerHTML=`${multi?`<span class="cnum">${num}</span>`:""}🔒 ${c.text}<span class="lockhint">（需要${STAT_LABEL[c.req.stat]} ${c.req.val},目前 ${stats[c.req.stat]}${c.lockedNote||""}）</span>`;
      choicesEl.append(lb);
      return;
    }
    const btn=mkChoice("",()=>doChoice(sc,c));
    let tags = c.bible?`<span class="tag bible">📖 聖經</span>`:"";
    const tgt = c.next && S[c.next];
    if(tgt && tgt.dynamic) tags += `<span class="tag bibleend">📖🏁 聖經結局</span>`;
    else if(tgt && tgt.ending) tags += `<span class="tag end">🏁 結局</span>`;
    if(!multi){
      btn.classList.add("single");
      btn.innerHTML = `▸ ${c.text}` + effChips(c.eff);
    }else{
      btn.innerHTML = `<span class="cnum">${num}</span>` + tags + c.text + effChips(c.eff);
    }
    choicesEl.append(btn);
  });
}

function mkChoice(txt,fn){
  const b=document.createElement("button");
  b.className="choice"; if(txt)b.textContent=txt; b.onclick=fn; return b;
}

function reset(){
  Object.assign(stats,START); flags={}; history=[]; journey=[];
  try{ localStorage.removeItem("joseph_save"); }catch(_){}
  go("start");
}

/* ---------- 標題畫面 ---------- */
function showTitle(){
  $("sceneTitle").textContent="序 · 一個夢的開始";
  const refEl=$("ref"); refEl.textContent=""; refEl.className="ref";
  $("art").innerHTML = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${artSVG("coat")}</svg>`;
  const main=$("text");
  main.classList.remove("fade"); void main.offsetWidth; main.classList.add("fade");
  main.innerHTML = `<div class="titlecard">
    <p class="hook">十七歲的約瑟,在一個偏了心的家裡長大——被親哥哥丟進井裡、賣到埃及。誘惑、冤獄、權力、報復——每一步,都由你決定。</p>
    <div class="legend">
      <div class="lead">✦ 每個選擇都有後果 · 8 種結局 · 一輪約 7 分鐘</div>
      <div>🌱 每個難關,你都可以<b>交託給神</b>(信心)、<b>自己解題</b>(智慧),或<b>交給別人的眼光</b>(認同)——三種倚靠,養成三種約瑟</div>
      <div><span class="tag bible" style="margin-right:6px">📖 聖經</span>聖經記載中約瑟實際的選擇——但不一定是「標準答案」</div>
      <div>🔒 數值不夠的路會鎖住;看得到它,就代表有另一種走法</div>
      <div><span class="tag end" style="margin-right:6px">🏁 結局</span>離開主線的出口;<span class="tag bibleend" style="margin-right:6px">📖🏁 聖經結局</span>通往聖經記載的結局之路</div>
    </div>
  </div>`;
  const choicesEl=$("choices");
  choicesEl.innerHTML="";
  const sv=loadSave();
  if(sv && sv.curId && S[sv.curId]){
    choicesEl.append(
      mkChoice("▶ 繼續上次的旅程",()=>{
        Object.assign(stats, sv.stats||{});
        flags = sv.flags||{};
        history = sv.history||[]; journey = sv.journey||[];
        history.pop();
        renderStats(); go(sv.curId);
      }),
      mkChoice("↻ 從頭開始新的一輪",()=>reset())
    );
  }else{
    choicesEl.append(mkChoice("▶ 開始你的故事",()=>reset()));
  }
  const total=Object.keys(ENDINGS).length;
  $("progress").textContent = unlocked.length?`已收集結局 ${unlocked.length}/${total}`:"";
  renderStats(); window.scrollTo(0,0);
}

/* ---------- 圖鑑 ---------- */
function openGallery(){
  const list=$("endlist"); list.innerHTML="";
  const total=Object.keys(ENDINGS).length;
  $("galCount").textContent=`已解鎖 ${unlocked.length} / ${total} 種結局`;
  if(unlocked.length===total){
    const ban=document.createElement("div");
    ban.className="complete";
    ban.innerHTML="🏆 <b>完整的人</b><br>你走完了約瑟所有的可能——信心、智慧、掌聲、安穩,完滿與半路的和好,也走過墜落與復仇。<br>現在,你想成為哪一個?";
    list.append(ban);
  }
  for(const [id,E] of Object.entries(ENDINGS)){
    const got=unlocked.includes(id);
    const row=document.createElement("div");
    row.className="endrow"+(got?"":" locked");
    const wtag=E.whatif?' <span style="color:#c9a06a;font-size:11px">✦ What-if</span>':'';
    row.innerHTML = got
      ? `<div><div class="nm">${E.kind==="good"?"★":E.kind==="bad"?"☠":"◇"} ${E.name}　<span style="color:var(--gold-soft)">${E.type}</span>${E.canonical?' <span style="color:#9cc0ee">📖</span>':''}${wtag}</div><div class="ds">${E.reflect||""}</div></div>`
      : `<div><div class="nm">???</div><div class="ds">線索:${E.hint||"尚未解鎖"}</div></div>`;
    list.append(row);
  }
  $("modalBg").classList.add("show");
}

/* ---------- 綁定 ---------- */
$("homeBtn").onclick=()=>showTitle();
$("restart").onclick=()=>{ $("confirmBg").classList.add("show"); };
$("confirmYes").onclick=()=>{ $("confirmBg").classList.remove("show"); reset(); };
$("confirmNo").onclick=()=>$("confirmBg").classList.remove("show");
$("gallery").onclick=openGallery;
$("closeModal").onclick=()=>$("modalBg").classList.remove("show");
$("modalBg").onclick=ev=>{ if(ev.target===$("modalBg")) $("modalBg").classList.remove("show"); };
$("confirmBg").onclick=ev=>{ if(ev.target===$("confirmBg")) $("confirmBg").classList.remove("show"); };
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){ $("modalBg").classList.remove("show"); $("confirmBg").classList.remove("show"); }
});

/* ---------- 啟動：一律先到標題畫面 ---------- */
showTitle();
</script>
</body>
</html>
