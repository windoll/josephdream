<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>約瑟的夢 — 文字冒險</title>
<style>
  :root{
    --bg:#1a1410; --panel:#241b13;
    --gold:#d9b15e; --gold-soft:#b8924a;
    --ink:#ede4d3; --ink-dim:#b8ac95; --sand:#3a2c1d;
    --accent:#c97b4a; --good:#7fae6b; --bad:#c45a52;
    --faith:#e8c46a; --wisdom:#8fc1e0; --ambition:#b58be0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Serif TC","Songti TC",serif;
    background:radial-gradient(1200px 600px at 50% -10%, #2a1f15 0%, var(--bg) 60%),var(--bg);
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.85;
  }
  #app{
    width:100%; max-width:780px;
    background:linear-gradient(180deg,#2b2016,#221912);
    border:1px solid #3d2e1f; border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(217,177,94,.12);
    overflow:hidden;
  }
  header{
    padding:22px 28px 18px; border-bottom:1px solid #3a2c1d;
    background:linear-gradient(180deg,rgba(217,177,94,.08),transparent); position:relative;
  }
  header h1{font-size:24px; letter-spacing:.18em; color:var(--gold); font-weight:700;}
  header .sub{font-size:12.5px; color:var(--ink-dim); letter-spacing:.25em; margin-top:4px;}
  .stats{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .stat{font-size:12px; color:var(--ink-dim); letter-spacing:.08em; display:flex; align-items:center; gap:7px; position:relative;}
  .bar{width:74px; height:7px; border-radius:6px; background:#1c150e; overflow:hidden; border:1px solid #3a2c1d;}
  .bar > i{display:block; height:100%; border-radius:6px; transition:width .5s ease}
  .bar.faith > i{background:linear-gradient(90deg,#caa44e,#f0d488)}
  .bar.wisdom > i{background:linear-gradient(90deg,#5d8ab0,#8fc1e0)}
  .bar.ambition > i{background:linear-gradient(90deg,#7d5bb0,#b58be0)}
  .bar.flash{animation:barflash .5s ease}
  @keyframes barflash{0%,100%{box-shadow:none}40%{box-shadow:0 0 10px 2px currentColor}}
  .floatup{
    position:absolute; right:-6px; top:-14px; font-size:13px; font-weight:700;
    pointer-events:none; animation:floatup .9s ease forwards;
  }
  @keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

  main{padding:24px 30px 10px}
  .art{
    width:100%; height:190px; border-radius:12px; overflow:hidden;
    border:1px solid #3a2c1d; margin-bottom:18px; background:#15100b;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);
  }
  .art svg{display:block; width:100%; height:100%}
  .scene-title{color:var(--gold-soft); font-size:13px; letter-spacing:.3em; margin-bottom:6px; text-transform:uppercase;}
  .ref{font-size:11.5px; color:#7c8aa0; letter-spacing:.05em; margin-bottom:14px}
  .ref.fiction{color:#9a7e5a}
  .text{font-size:17.5px; color:var(--ink); white-space:pre-wrap; min-height:80px;}
  .text p{margin-bottom:14px}

  .choices{padding:8px 30px 30px; display:flex; flex-direction:column; gap:12px}
  button.choice{
    text-align:left; font-family:inherit; font-size:16px; color:var(--ink);
    background:linear-gradient(180deg,#312415,#281d12); border:1px solid #4a3826;
    padding:14px 17px; border-radius:11px; cursor:pointer; transition:all .18s ease;
    position:relative; line-height:1.6;
  }
  button.choice:hover{border-color:var(--gold); color:#fff; transform:translateX(4px); box-shadow:-4px 0 0 0 var(--gold);}
  button.choice .tag{
    display:inline-block; font-size:11px; letter-spacing:.1em; color:var(--bg);
    background:var(--gold-soft); padding:1px 8px; border-radius:20px; margin-right:8px; vertical-align:middle;
  }
  button.choice .tag.bible{background:#3a5a8c; color:#eaf2ff}
  .effs{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
  .eff{font-size:11.5px; letter-spacing:.05em; padding:2px 9px; border-radius:20px; border:1px solid; background:rgba(0,0,0,.25); font-weight:600;}

  .ending{text-align:center; padding:6px 0 4px}
  .ending .badge{font-size:13px; letter-spacing:.3em; color:var(--gold)}
  .ending h2{font-size:26px; margin:10px 0; color:#fff; letter-spacing:.06em}
  .ending .kind{font-size:13px; color:var(--ink-dim); letter-spacing:.2em}
  .ending .kind.good{color:var(--good)} .ending .kind.bad{color:var(--bad)}
  .ending .canon{margin-top:14px; font-size:13px; color:#9cc0ee; letter-spacing:.12em; border:1px solid #3a5a8c; border-radius:20px; padding:6px 14px; display:inline-block;}
  .reflect{margin-top:18px; background:#1e160e; border:1px solid #4a3826; border-radius:10px; padding:14px 16px; font-size:14px; color:var(--ink-dim);}
  .reflect b{color:var(--gold-soft); letter-spacing:.1em; display:block; margin-bottom:6px; font-size:12px}
  .journey{margin-top:18px; border-top:1px solid #3a2c1d; padding-top:14px}
  .journey > b{color:var(--gold-soft); letter-spacing:.18em; font-size:12px}
  .jrow{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0; border-bottom:1px dashed #33271a; color:var(--ink-dim)}
  .jrow .jt{color:var(--gold-soft); min-width:84px}
  .jrow .jc{flex:1; color:var(--ink)}
  .jrow .je{font-size:11px; font-weight:700}

  footer{display:flex; justify-content:space-between; align-items:center; padding:14px 26px 18px; border-top:1px solid #3a2c1d; font-size:12px; color:var(--ink-dim);}
  .links{display:flex; gap:16px}
  .links a{color:var(--gold-soft); cursor:pointer; text-decoration:none; letter-spacing:.08em}
  .links a:hover{color:var(--gold); text-decoration:underline}
  .verse{margin-top:16px; font-size:13.5px; color:var(--gold-soft); font-style:italic; border-left:2px solid var(--gold-soft); padding-left:12px; letter-spacing:.04em;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:24px; z-index:10;}
  .modal-bg.show{display:flex}
  .modal{background:#241b13; border:1px solid #4a3826; border-radius:14px; max-width:520px; width:100%; padding:26px; max-height:80vh; overflow:auto;}
  .modal h3{color:var(--gold); letter-spacing:.2em; margin-bottom:16px; font-size:18px}
  .endlist{display:flex; flex-direction:column; gap:10px}
  .endrow{display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border:1px solid #3a2c1d; border-radius:9px; background:#1e160e;}
  .endrow.locked{color:#5d5343; font-style:italic}
  .endrow .nm{font-size:14.5px} .endrow .ds{font-size:12px; color:var(--ink-dim); margin-top:3px}
  .modal .close{margin-top:18px; width:100%; padding:11px; border-radius:9px; cursor:pointer; background:var(--gold-soft); border:none; color:var(--bg); font-family:inherit; font-size:14px; letter-spacing:.2em;}
  .count{font-size:12px; color:var(--ink-dim); margin-bottom:14px; letter-spacing:.1em}

  .fade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media(max-width:560px){
    main{padding:20px 20px 8px}.choices{padding:6px 20px 24px}
    header{padding:18px 20px 16px}.text{font-size:16.5px}.art{height:150px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>約 瑟 的 夢</h1>
    <div class="sub">創世記 · 文字冒險 · 三屬性抉擇</div>
    <div class="stats" id="stats">
      <div class="stat statRow" data-k="faith" style="color:var(--faith)">信心 <span class="bar faith"><i></i></span></div>
      <div class="stat statRow" data-k="wisdom" style="color:var(--wisdom)">智慧 <span class="bar wisdom"><i></i></span></div>
      <div class="stat statRow" data-k="ambition" style="color:var(--ambition)">野心 <span class="bar ambition"><i></i></span></div>
    </div>
  </header>
  <main>
    <div class="art" id="art"></div>
    <div class="scene-title" id="sceneTitle"></div>
    <div class="ref" id="ref"></div>
    <div class="text" id="text"></div>
  </main>
  <div class="choices" id="choices"></div>
  <footer>
    <div class="links">
      <a id="restart">↻ 重新開始</a>
      <a id="gallery">📜 結局圖鑑</a>
    </div>
    <div id="progress"></div>
  </footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>結 局 圖 鑑</h3>
    <div class="count" id="galCount"></div>
    <div class="endlist" id="endlist"></div>
    <button class="close" id="closeModal">關閉</button>
  </div>
</div>

<script>
/* ============================================================
   約瑟的夢 — 劇情引擎
   數值: faith 信心 / wisdom 智慧 / ambition 野心 (0–100，整十增減)
   三軸獨立：最高的屬性決定（寬恕路線的）最終結局
   ============================================================ */

/* ---------- 場景插畫 (內嵌 SVG，離線可用) ---------- */
function artSVG(key){
  const sky=(a,b)=>`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="190" fill="url(#sky)"/>`;
  // 麥束（糧倉場景用）
  const sheaf=(x)=>`<g transform="translate(${x},150)">
      <polygon points="-5,-2 5,-2 26,-56 -26,-56" fill="#cda552"/>
      <g stroke="#9c7a30" stroke-width="2">
        <line x1="0" y1="-6" x2="-22" y2="-54"/><line x1="0" y1="-6" x2="-9" y2="-58"/>
        <line x1="0" y1="-6" x2="8" y2="-58"/><line x1="0" y1="-6" x2="22" y2="-54"/>
      </g>
      ${[-22,-9,8,22].map(gx=>`<ellipse cx="${gx}" cy="-55" rx="5" ry="9" fill="#e9c873"/>`).join("")}
      <rect x="-8" y="-16" width="16" height="9" rx="3" fill="#8a6a2e"/>
    </g>`;
  const A={
    coat: sky("#5a3f6b","#7a4a3a")+
      `<circle cx="70" cy="50" r="20" fill="#f3e2a8"/>
       <g transform="translate(200,30)">
         <rect x="-46" y="20" width="92" height="120" rx="8" fill="#c9863f"/>
         <rect x="-46" y="20" width="92" height="20" fill="#b85b3a"/>
         <rect x="-46" y="50" width="92" height="16" fill="#d9b15e"/>
         <rect x="-46" y="78" width="92" height="16" fill="#5d8ab0"/>
         <rect x="-46" y="106" width="92" height="16" fill="#7fae6b"/>
         <rect x="-64" y="26" width="22" height="56" rx="6" fill="#c9863f"/>
         <rect x="42" y="26" width="22" height="56" rx="6" fill="#c9863f"/>
       </g>`,
    desert: sky("#e0a85a","#c97b4a")+
      `<circle cx="200" cy="56" r="28" fill="#fff2cf" opacity=".95"/>
       <rect y="138" width="400" height="52" fill="#caa05c"/>
       <path d="M0 152 Q100 124 200 152 T400 152 L400 190 L0 190 Z" fill="#b88846"/>
       <g fill="#5a3f28" transform="translate(232,92)">
         <rect x="8" y="30" width="6" height="28"/><rect x="22" y="30" width="6" height="28"/>
         <rect x="46" y="30" width="6" height="28"/><rect x="60" y="30" width="6" height="28"/>
         <ellipse cx="37" cy="28" rx="34" ry="13"/>
         <path d="M10 28 Q21 4 33 28 Q45 4 64 28 Z"/>
         <path d="M62 30 Q77 24 75 5 Q83 1 87 8 Q85 16 80 16 Q80 24 74 32 Z"/>
         <path d="M5 22 Q-4 28 1 40" stroke="#5a3f28" stroke-width="3" fill="none"/>
       </g>`,
    pit: sky("#23344f","#3a2c1d")+
      `<circle cx="60" cy="44" r="18" fill="#f3e2a8" opacity=".85"/>
       <rect y="120" width="400" height="70" fill="#43321f"/>
       <ellipse cx="200" cy="128" rx="78" ry="20" fill="#2a1f13"/>
       <path d="M130 130 L150 190 L250 190 L270 130 Z" fill="#1a120a"/>
       <ellipse cx="200" cy="128" rx="64" ry="14" fill="#0d0905"/>`,
    pyramid: sky("#f0c674","#d98c4a")+
      `<circle cx="320" cy="52" r="26" fill="#fff4d4"/>
       <rect y="140" width="400" height="50" fill="#cfa157"/>
       <polygon points="90,140 175,46 260,140" fill="#caa05c"/><polygon points="175,46 260,140 220,140 175,70" fill="#a87f3e"/>
       <polygon points="220,140 285,78 350,140" fill="#bd9450"/>`,
    house: sky("#caa45e","#8a6a40")+
      `<rect y="120" width="400" height="70" fill="#6e5535"/>
       <rect x="80" y="60" width="240" height="80" fill="#b89154"/>
       <rect x="80" y="48" width="240" height="16" fill="#8a6a3e"/>
       <rect x="120" y="90" width="34" height="50" fill="#3a2a18"/><rect x="246" y="90" width="34" height="50" fill="#3a2a18"/>
       <rect x="190" y="84" width="20" height="56" fill="#caa05c"/>
       <circle cx="60" cy="44" r="16" fill="#f3e2a8" opacity=".85"/>`,
    prison: sky("#2a2636","#1a1622")+
      `<rect width="400" height="190" fill="#241d28"/>
       <rect y="150" width="400" height="40" fill="#15101a"/>
       ${[70,130,190,250,310].map(x=>`<rect x="${x}" y="30" width="10" height="120" fill="#4a4150"/>`).join("")}
       <rect x="40" y="26" width="320" height="10" fill="#4a4150"/><rect x="40" y="146" width="320" height="10" fill="#4a4150"/>
       <rect x="30" y="50" width="8" height="60" fill="#d9b15e" opacity=".3"/>`,
    pharaoh: sky("#e8c46a","#b8863c")+
      `<rect y="140" width="400" height="50" fill="#a87f3e"/>
       <polygon points="170,140 170,80 200,60 230,80 230,140" fill="#d9b15e"/>
       <rect x="178" y="92" width="44" height="48" fill="#c99a3e"/>
       <circle cx="200" cy="74" r="13" fill="#caa05c"/>
       <rect x="150" y="138" width="100" height="6" fill="#8a6a3e"/>
       ${[120,160,240,280].map(x=>`<rect x="${x}" y="70" width="9" height="70" fill="#bd9450"/>`).join("")}
       <circle cx="60" cy="44" r="18" fill="#fff4d4"/>`,
    grain: sky("#f0c674","#d9a24a")+
      `<circle cx="334" cy="46" r="22" fill="#fff4d4"/>
       <rect y="150" width="400" height="40" fill="#c89a4e"/>
       <ellipse cx="92" cy="150" rx="40" ry="20" fill="#9c7a44"/>
       <path d="M58 150 Q60 124 92 122 Q124 124 126 150 Z" fill="#a9854c"/>
       <path d="M62 150 Q64 130 92 128 Q120 130 122 150 Z" fill="#b8924f"/>
       ${sheaf(190)+sheaf(238)+sheaf(286)}`,
    reunion: sky("#c98a5a","#7a4a3a")+
      `<circle cx="200" cy="54" r="26" fill="#fff0cf" opacity=".9"/>
       <rect y="140" width="400" height="50" fill="#5a4128"/>
       <g fill="#3a2a18">
         <circle cx="160" cy="104" r="16"/><rect x="146" y="118" width="28" height="34" rx="6"/>
         <circle cx="240" cy="104" r="16"/><rect x="226" y="118" width="28" height="34" rx="6"/>
       </g>
       <path d="M176 120 Q200 108 224 120" stroke="#d9b15e" stroke-width="4" fill="none"/>`,
    good: sky("#caa44e","#7fae6b")+`<circle cx="200" cy="80" r="48" fill="#f3e8b8" opacity=".5"/><circle cx="200" cy="80" r="30" fill="#fff4d4"/><rect y="150" width="400" height="40" fill="#5d7a4a"/>`,
    bad: sky("#3a2630","#15100f")+`<circle cx="200" cy="70" r="30" fill="#6b5040" opacity=".6"/><rect y="150" width="400" height="40" fill="#1a1210"/><path d="M120 150 L160 110 L200 150 L250 100 L300 150 Z" fill="#241712"/>`,
    neutral: sky("#4a4a55","#2a2a30")+`<circle cx="320" cy="50" r="20" fill="#cfcad0" opacity=".7"/><rect y="150" width="400" height="40" fill="#22221f"/><path d="M60 150 Q150 120 240 150 T400 150" fill="#33332f"/>`,
  };
  return A[key]||A.coat;
}

/* ---------- 結局 (共 7 種) ---------- */
const ENDINGS = {
  reconcile:  {name:"飽足之地", kind:"good", canonical:true,
    desc:"三屬性均衡,你寬恕了哥哥,全家在歌珊團聚。這是聖經創世記中約瑟真實的結局。",
    reflect:"約瑟說:「從前你們的意思是要害我,但 神的意思原是好的。」回頭看你的難處,是否也曾在其中發現未曾預料的恩典?"},
  faith_crown:{name:"夢的應驗", kind:"good",
    desc:"信心最高。你自始至終信靠那位賜夢的神,夢完全應驗,你成為祝福萬民的器皿。",
    reflect:"在看不見出路的兩年牢獄裡,是什麼讓約瑟仍然信靠?換作是你,會如何持守?"},
  wise_savior:{name:"萬民的拯救者", kind:"good",
    desc:"智慧最高。你以過人的才智治理埃及,設立糧政,使埃及與列國都得存活。",
    reflect:"聰明才智若用在愛人、救人之上,能成就多大的善?你的恩賜正用在哪裡?"},
  egypt_lord: {name:"埃及的權臣", kind:"neutral",
    desc:"野心最高。你登上權力頂峰,成為埃及最有權勢的人。夢應驗了——只是你心心念念的,究竟是神的託付,還是自己的功業?",
    reflect:"成功與呼召有時看起來一樣,卻未必相同。你如何分辨自己真正在追求什麼?"},
  shepherd:   {name:"平凡的牧人", kind:"neutral",
    desc:"婉拒了命運的呼召,回鄉守著羊群終老。",
    reflect:"安穩與呼召之間,你會怎麼選?把恩賜埋藏起來,也是一種損失嗎?"},
  fallen:     {name:"墜落的奴隸", kind:"bad",
    desc:"在波提乏家屈服於試探,聲名與性命一同墜落。",
    reflect:"一時的妥協,如何可能毀掉長久的呼召?約瑟說「我怎能得罪神」時,他在守護的是什麼?"},
  revenge:    {name:"復仇的筵席", kind:"bad",
    desc:"當哥哥跪下時,你選擇了報復,而非寬恕。",
    reflect:"報復似乎能討回公道,卻為何往往讓人更不自由?寬恕與軟弱有什麼不同?"},
};
let unlocked = JSON.parse(localStorage.getItem("joseph_endings")||"[]");

/* ---------- 劇情 ---------- */
const S = {};
function scene(id, def){ S[id]=def; }
const e = (faith=0,wisdom=0,ambition=0)=>({faith,wisdom,ambition});

/* 三選一，對應 信心 / 智慧 / 野心；bible:true 表示符合聖經記載 */

scene("start",{
  title:"第一幕 · 希伯崙的帳棚", art:"coat", ref:"創世記 37:3–9",
  text:`你是約瑟,雅各最疼愛的兒子。父親給了你一件彩衣,在烈日下閃著光。十個哥哥在曠野牧羊,眼神裡的寒意你裝作沒看見。

昨夜你又做了那個夢——田裡的禾捆,哥哥們的捆向你的捆下拜。今早,夢還在你舌尖打轉。你要怎麼面對它?`,
  verse:"「看哪,那做夢的來了。」",
  choices:[
    {text:"向賜夢的神默禱、交託。", next:"dothan", eff:e(10,0,0)},
    {text:"把夢藏在心裡,靜觀其變。", next:"dothan", eff:e(0,10,0)},
    {text:"在哥哥面前宣告:這夢必要成真!", next:"dothan", eff:e(0,0,20), bible:true},
  ]
});

scene("dothan",{
  title:"第一幕 · 多坍的曠野", art:"desert", ref:"創世記 37:12–24",
  text:`父親差你去探望哥哥們。你尋到多坍,遠遠地,他們認出那件彩衣。

「來吧,我們把他殺了,丟在坑裡!」密謀順著風飄來。大哥流便想攔阻,口氣卻軟弱。危機當前,你——`,
  choices:[
    {text:"坦然面對,把性命交託神手。", next:"the_pit", eff:e(10,0,0)},
    {text:"機智周旋,冷靜觀察局勢。", next:"the_pit", eff:e(0,10,0)},
    {text:"暗暗立志:有朝一日要凌駕眾兄之上。", next:"the_pit", eff:e(0,0,10)},
  ]
});

scene("the_pit",{
  title:"第一幕 · 枯井", art:"pit", ref:"創世記 37:25–28",

/* ============================================================
   引擎
   ============================================================ */
const START={faith:10, wisdom:10, ambition:10};
const stats = {...START};
let history = [];
let journey = [];
const $ = id=>document.getElementById(id);
function clamp(v){return Math.max(0,Math.min(100,v));}
function applyEff(eff){ if(!eff)return;
  stats.faith=clamp(stats.faith+(eff.faith||0));
  stats.wisdom=clamp(stats.wisdom+(eff.wisdom||0));
  stats.ambition=clamp(stats.ambition+(eff.ambition||0));
}
function renderStats(){
  document.querySelector(".faith>i").style.width=stats.faith+"%";
  document.querySelector(".wisdom>i").style.width=stats.wisdom+"%";
  document.querySelector(".ambition>i").style.width=stats.ambition+"%";
}
function floatStat(eff){
  const colors={faith:"#e8c46a",wisdom:"#8fc1e0",ambition:"#b58be0"};
  ["faith","wisdom","ambition"].forEach(k=>{
    const v=eff&&eff[k]; if(!v) return;
    const row=document.querySelector('.statRow[data-k="'+k+'"]'); if(!row) return;
    const s=document.createElement("span");
    s.className="floatup"; s.style.color=colors[k];
    s.textContent=(v>0?"+":"−")+Math.abs(v);
    row.appendChild(s); setTimeout(()=>s.remove(),900);
    const bar=row.querySelector(".bar"); if(bar){ bar.classList.add("flash"); setTimeout(()=>bar.classList.remove("flash"),500); }
  });
}
function effChips(eff){
  if(!eff) return "";
  const map=[["faith","信心","#e8c46a"],["wisdom","智慧","#8fc1e0"],["ambition","野心","#b58be0"]];
  let out="";
  for(const [k,label,color] of map){
    const v=eff[k]||0; if(v===0) continue;
    out+=`<span class="eff" style="color:${color};border-color:${color}66">${v>0?"+":"−"}${Math.abs(v)} ${label}</span>`;
  }
  return out?`<div class="effs">${out}</div>`:"";
}
function paraHTML(txt){ return txt.split("\n\n").map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join(""); }

function save(curId){ localStorage.setItem("joseph_save", JSON.stringify({curId, stats, history, journey})); }
function loadSave(){ try{return JSON.parse(localStorage.getItem("joseph_save"));}catch(_){return null;} }
function unlock(endId){
  if(!unlocked.includes(endId)){ unlocked.push(endId); localStorage.setItem("joseph_endings", JSON.stringify(unlocked)); }
}
/* 寬恕路線：最高且明顯領先的屬性決定結局；平衡則為飽足之地 */
function pickDynamicEnding(){
  const {faith,wisdom,ambition}=stats;
  const max=Math.max(faith,wisdom,ambition);
  if(max>=60){
    if(faith===max && faith>wisdom && faith>ambition) return "faith_crown";
    if(wisdom===max && wisdom>faith && wisdom>ambition) return "wise_savior";
    if(ambition===max && ambition>faith && ambition>wisdom) return "egypt_lord";
  }
  return "reconcile";
}

function go(id){
  const sc = S[id];
  if(!sc){console.error("missing scene",id);return;}
  history.push(id);

  let endingId = sc.ending;
  if(sc.dynamic) endingId = pickDynamicEnding();

  $("sceneTitle").textContent = sc.title||"";
  const refEl=$("ref");
  refEl.textContent = sc.ref||"";
  refEl.className = "ref"+(sc.fiction||(sc.ref&&sc.ref.indexOf("What-if")>=0)?" fiction":"");

  const art=$("art");
  art.classList.remove("fade"); void art.offsetWidth; art.classList.add("fade");
  art.innerHTML = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${artSVG(sc.art)}</svg>`;

  const main = $("text");
  main.classList.remove("fade"); void main.offsetWidth; main.classList.add("fade");
  const choicesEl = $("choices");
  choicesEl.innerHTML="";

  if(endingId){
    unlock(endingId);
    const E = ENDINGS[endingId];
    main.innerHTML = `<div class="ending">
        <div class="badge">— 結 局 —</div>
        <h2>${E.name}</h2>
        <div class="kind ${E.kind}">${E.kind==="good"?"★ 美好結局":E.kind==="bad"?"☠ 悲劇結局":"◇ 中性結局"}</div>
        ${E.canonical?'<div class="canon">📖 這是聖經創世記中約瑟真實的結局</div>':''}
      </div>`
      + paraHTML(sc.text)
      + (sc.verse?`<div class="verse">${sc.verse}</div>`:"")
      + (E.reflect?`<div class="reflect"><b>反思</b>${E.reflect}</div>`:"")
      + journeyHTML();
    const total=Object.keys(ENDINGS).length;
    choicesEl.append(
      mkChoice("↻ 再玩一次,走不同的路",()=>reset()),
      mkChoice(`📜 查看結局圖鑑 (${unlocked.length}/${total})`,()=>openGallery())
    );
    $("progress").textContent="已抵達結局";
    localStorage.removeItem("joseph_save");
    renderStats(); return;
  }

  main.innerHTML = paraHTML(sc.text)+(sc.verse?`<div class="verse">${sc.verse}</div>`:"");
  renderChoices(sc);
  $("progress").textContent = `第 ${history.length} 段`;
  renderStats(); save(id);
}

function journeyHTML(){
  if(!journey.length) return "";
  const ic={faith:["信心","#e8c46a"],wisdom:["智慧","#8fc1e0"],ambition:["野心","#b58be0"]};
  const rows=journey.map(j=>{
    let chip="";
    for(const k of ["faith","wisdom","ambition"]){
      const v=j.eff&&j.eff[k]; if(!v) continue;
      chip+=`<span class="je" style="color:${ic[k][1]}">${v>0?"+":"−"}${Math.abs(v)}${ic[k][0]}</span> `;
    }
    return `<div class="jrow"><div class="jt">${j.title}</div><div class="jc">${j.choice}${j.bible?' <span style="color:#9cc0ee">📖</span>':''}</div><div>${chip}</div></div>`;
  }).join("");
  return `<div class="journey"><b>— 你 的 旅 程 —</b>${rows}</div>`;
}

function renderChoices(sc){
  const choicesEl=$("choices");
  choicesEl.innerHTML="";
  (sc.choices||[]).forEach(c=>{
    if(c.cond && !c.cond(stats)) return;
    const btn=mkChoice("",()=>{
      applyEff(c.eff); floatStat(c.eff); renderStats();
      journey.push({title:(sc.title||"").replace(/^第.+· /,""), choice:c.text, eff:c.eff, bible:!!c.bible});
      go(c.next);
    });
    const bibleTag=c.bible?`<span class="tag bible">📖 聖經</span>`:"";
    btn.innerHTML = bibleTag + c.text + effChips(c.eff);
    choicesEl.append(btn);
  });
}

function mkChoice(txt,fn){
  const b=document.createElement("button");
  b.className="choice"; if(txt)b.textContent=txt; b.onclick=fn; return b;
}
function reset(){
  Object.assign(stats,START); history=[]; journey=[];
  localStorage.removeItem("joseph_save"); go("start");
}
function openGallery(){
  const list=$("endlist"); list.innerHTML="";
  const total=Object.keys(ENDINGS).length;
  $("galCount").textContent=`已解鎖 ${unlocked.length} / ${total} 種結局`;
  for(const [id,E] of Object.entries(ENDINGS)){
    const got=unlocked.includes(id);
    const row=document.createElement("div");
    row.className="endrow"+(got?"":" locked");
    row.innerHTML = got
      ? `<div><div class="nm">${E.kind==="good"?"★":E.kind==="bad"?"☠":"◇"} ${E.name}${E.canonical?' <span style="color:#9cc0ee">📖</span>':''}</div><div class="ds">${E.desc}</div></div>`
      : `<div><div class="nm">???</div><div class="ds">尚未解鎖的結局</div></div>`;
    list.append(row);
  }
  $("modalBg").classList.add("show");
}

$("restart").onclick=()=>{ if(confirm("確定要從頭開始嗎?目前進度會消失。")) reset(); };
$("gallery").onclick=openGallery;
$("closeModal").onclick=()=>$("modalBg").classList.remove("show");
$("modalBg").onclick=ev=>{ if(ev.target===$("modalBg")) $("modalBg").classList.remove("show"); };

(function init(){
  const sv=loadSave();
  if(sv && sv.curId && S[sv.curId]){
    Object.assign(stats, sv.stats||{});
    history = sv.history||[]; journey = sv.journey||[];
    history.pop();
    renderStats(); go(sv.curId);
  }else{ go("start"); }
})();
</script>
